<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Adams Express</title>
    <style>
        body {
            background-color: #0f0c1b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #8a2be2; margin-bottom: 5px; }
        p { color: #a0a0c0; }
        .search-container { margin: 30px auto; max-width: 500px; }
        input {
            width: 100%; padding: 12px; border: 2px solid #8a2be2;
            background: #1a1530; color: white; border-radius: 25px;
            outline: none; font-size: 16px; box-sizing: border-box;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; max-width: 1000px; margin: 40px auto; padding: 0 20px;
        }
        .card {
            background: #1a1530; border: 1px solid #332555; border-radius: 12px;
            padding: 15px; cursor: pointer; transition: 0.2s;
        }
        .card:hover { transform: translateY(-5px); border-color: #8a2be2; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .card h3 { margin: 10px 0 0 0; font-size: 16px; }
    </style>
</head>
<body>

    <h1>ALEX ADAMS EXPRESS</h1>
    <p>Fast, unblocked proxy gaming hub.</p>

    <div class="search-container">
        <form id="proxy-form">
            <input type="text" id="proxy-search" placeholder="Type a URL or search DuckDuckGo unblocked...">
        </form>
    </div>

    <div class="grid">
        <div class="card" onclick="proxyLaunch('https://now.gg')">
            <img src="https://unsplash.com" alt="Roblox">
            <h3>now.gg (Roblox/Mobile)</h3>
        </div>
        <div class="card" onclick="proxyLaunch('https://poki.com')">
            <img src="https://unsplash.com" alt="Poki">
            <h3>Poki Games</h3>
        </div>
        <div class="card" onclick="proxyLaunch('https://crazygames.com')">
            <img src="https://unsplash.com" alt="CrazyGames">
            <h3>CrazyGames</h3>
        </div>
    </div>

    <script>
        document.getElementById('proxy-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var query = document.getElementById('proxy-search').value.trim();
            if (!query) return;

            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (!query.includes('.') || query.includes(' ')) {
                    query = 'https://duckduckgo.com' + encodeURIComponent(query);
                } else {
                    query = 'https://' + query;
                }
            }

            proxyLaunch(query);
        });

        function proxyLaunch(url) {
            window.location.href = '/search/' + encodeURIComponent(url);
        }
    </script>
</body>
</html>
