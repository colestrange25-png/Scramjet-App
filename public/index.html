<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Adams Express</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #111;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            color: #888;
            margin-top: 7px;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .profile {
            margin-bottom: 35px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #444;
            margin-bottom: 15px;
        }

        .profile h2 {
            font-size: 26px;
        }

        .proxy-box {
            background: #151515;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #292929;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        input {
            width: 75%;
            padding: 15px;
            background: #090909;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 22px;
            margin-left: 8px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        .notice {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: #555;
            padding: 30px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ALEX ADAMS EXPRESS</h1>
        <p>Let's Watch Alex Adams!</p>
    </header>

    <main class="container">

        <div class="profile">
            
            <img src="alex-adams.jpg" alt="Alex Adams">
            <h2>Alex Adams Express</h2>
        </div>
                
            </form>
            
       <div class="search-container">
        <form action="/search" method="GET">
            <input type="text" name="url" placeholder="Type a URL or search">
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var inputField = document.querySelector('input[name="url"]');
            var query = inputField.value.trim();
            if (!query) return;

            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (!query.includes('.') || query.includes(' ')) {
                    inputField.value = 'https://duckduckgo.com' + encodeURIComponent(query);
                } else {
                    inputField.value = 'https://' + query;
                }
            }
        });

        function proxyLaunch(url) {
            window.location.href = '/search?url=' + encodeURIComponent(url);
        }
    </script>

</body>
</html>
